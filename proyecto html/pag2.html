<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/proyecto html/css/pag2.css">
    <title>Ticket</title>
</head>
<body>
    <header>
        <button class="back">
            <a href="/proyecto html/pag1.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="0.5rem" height="2rem" viewBox="0 0 12 24"><path fill="white" fill-rule="evenodd" d="m3.343 12l7.071 7.071L9 20.485l-7.778-7.778a1 1 0 0 1 0-1.414L9 3.515l1.414 1.414z"/></svg>
            </a>
        </button>
        <button class="dots">
            <svg xmlns="http://www.w3.org/2000/svg" width="1rem" height="1rem" viewBox="0 0 24 24"><path fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0-2 0m7 0a1 1 0 1 0 2 0a1 1 0 1 0-2 0m7 0a1 1 0 1 0 2 0a1 1 0 1 0-2 0"/></svg>
        </button>
    </header>
    <div class="ticket">
        <div class="ticket-image">
            <img src="/proyecto html/image/Topconcert1.jpg" alt="Concert Image">
        </div>
        <div class="ticket-content">
            <h2>Twenty One Pilots · Bandito Tour</h2>
            <p>October 25 2025 · United Center, Chicago,IL</p>
            <div class="ticket-details">
                <div class="info">
                    <p><strong>Name</strong><br>Andres Araque</p>
                    <p><strong>Date</strong><br>October 25 2025</p>
                    <p><strong>Gate</strong><br>Clancy</p>
                </div>
                <div class="info">
                    <p><strong>Order Number</strong><br>CLD18229PL</p>
                    <p><strong>Time</strong><br>9:00 PM</p>
                    <p><strong>Seat</strong><br>0822</p>
                </div>
            </div>
        </div>
        <div class="ticket-barcode">
            <img src="barcode.png" alt="Barcode">
            <p>Scan your barcode at the entry gate.</p>
        </div>
    </div>
    
</body>
</html>
