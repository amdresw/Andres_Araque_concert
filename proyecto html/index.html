<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles-m.css">
    <link rel="stylesheet" href="css/nbutton.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <title>Concert</title>
</head>
<body>
    <div class="header">
        <button class="menu-icon">☰</button>
        <div class="dropdown-area">
          <div class="notify-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-bell"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div class="notification-indicator">2</div>
          </div>
          <ul class="notify-area">
            <li>Example</li>
            <li>Other Example</li>
            <li>Click Outside to Close</li>
          </ul>
          <script src="./js/nbutton.js"></script>
        </div>
    </div>
    <div class="main-title">
      <h1>Find<span class="highligth"><br> Trending Events</span></h1>
     </div>
    <div class="search-bar">
      <input type="text" placeholder="Search events..." />
      <i class="fas fa-search"></i>
    </div>
    <div class="results"></div> <!-- Contenedor para mostrar resultados -->

    <div id="menu" class="menu-container">
      <button class="category-btn" data-category="music" style="background-color:#e7daf3 ;">Music Concert</button>
      <button class="category-btn" data-category="exhibition" style="background-color: #b0c5d6;">Exhibition</button>
      <button class="category-btn" data-category="standup" style="background-color: #aedbc3;">Stand Up Show</button>
      <button class="category-btn" data-category="theater" style="background-color: #f5d0c9 ;">Theater</button>
      </div>

    <div class="carousel">
      <div class="carousel-item"></div>
      <div class="carousel-item"></div>
      <div class="carousel-item"></div>
      <div class="carousel-item"></div>
      <div class="carousel-item"></div> 
    </div>
  
</body>
</html>
